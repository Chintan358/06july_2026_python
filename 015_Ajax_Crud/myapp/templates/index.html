<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script>

        $(document).ready(function () {
            display()
            $("#upbtn").hide()
        })


        function display() {

            $.get("display", {}, function (rt) {

                var rows = ""
                rt.data.map(ele => {

                    rows += `<tr>
                      <td>${ele.id}</td> 
                      <td>${ele.name}</td>    
                      <td>${ele.price}</td>    
                      <td>${ele.qty}</td>
                      <td>${ele.brand}</td>     
                      <td><button class='btn btn-danger' onclick='delete_product(${ele.id})'>Delete</button></td>  
                        <td><button class='btn btn-primary' onclick='retrive_product(${ele.id})'>Update</button></td>  
                    </tr>`

                })

                $("#tdata").html(rows)


            })

        }

        function register() {
            var name = $("#name").val()
            var price = $("#price").val()
            var qty = $("#qty").val()
            var brand = $("#brand").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

            $.post("register", { csrfmiddlewaretoken, name, price, qty, brand }, function (rt) {
                alert(rt)
                display()
                reset()
            })




        }



        function reset() {
            $("#id").val("")
            $("#name").val("")
            $("#price").val("")
            $("#qty").val("")
            $("#brand").val("")
        }

        function delete_product(pid) {

            if (confirm("Are you sure want to delete? ")) {
                $.get("delete", { pid }, function (rt) {
                    alert(rt)
                    display()
                })
            }
        }


        function retrive_product(pid) {

            $.get("retrive", { pid }, function (rt) {

                $("#id").val(rt.data[0].id)
                $("#name").val(rt.data[0].name)
                $("#price").val(rt.data[0].price)
                $("#qty").val(rt.data[0].qty)
                $("#brand").val(rt.data[0].brand)

                $("#upbtn").show()
                $("#smbtn").hide()
            })
        }


        function update() {

            var id = $("#id").val()
            var name = $("#name").val()
            var price = $("#price").val()
            var qty = $("#qty").val()
            var brand = $("#brand").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

            $.post("update", { csrfmiddlewaretoken, id, name, price, qty, brand }, function (rt) {
                alert(rt)
                display()
                reset()

                $("#upbtn").hide()
                $("#smbtn").show()
            })




        }

    </script>




</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Product Registration</h2>

        <div class="row">

            <!-- Product Registration Form -->
            <div class="col-md-4">

                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Register Product</h5>
                    </div>

                    <div class="card-body">

                        {%csrf_token%}

                        <input type="hidden" id="id">
                        <!-- Product Name -->
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" placeholder="Enter product name" id="name">
                        </div>

                        <!-- Price -->
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" placeholder="Enter price" id="price">
                        </div>

                        <!-- Quantity -->
                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" placeholder="Enter quantity" id="qty">
                        </div>

                        <!-- Brand -->
                        <div class="mb-3">
                            <label class="form-label">Brand</label>
                            <input type="text" class="form-control" placeholder="Enter brand" id="brand">
                        </div>

                        <button class="btn btn-success" onclick="register()" id="smbtn">
                            Register Product
                        </button>

                        <button class="btn btn-success" onclick="update()" id="upbtn">
                            Update Product
                        </button>

                        <button class="btn btn-secondary" onclick="reset()">
                            Reset
                        </button>



                    </div>
                </div>

            </div>


            <!-- Product Display Table -->
            <div class="col-md-8">

                <div class="card">

                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Product List</h5>
                    </div>

                    <div class="card-body">

                        <table class="table table-bordered table-striped">

                            <thead class="table-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Product Name</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                    <th>Brand</th>
                                    <th colspan="2">Action</th>
                                </tr>
                            </thead>

                            <tbody id="tdata">


                            </tbody>

                        </table>

                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
