<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>Product Registration</h3>
                    </div>

                    <div class="card-body">

                        <form method="post">
                            {%csrf_token%}
                            <!-- Product Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="name" name="name"
                                    placeholder="Enter product name" required>
                            </div>

                            <!-- Price -->
                            <div class="mb-3">
                                <label for="price" class="form-label">Price</label>
                                <input type="number" class="form-control" id="price" name="price"
                                    placeholder="Enter price" step="0.01" required>
                            </div>

                            <!-- Quantity -->
                            <div class="mb-3">
                                <label for="qty" class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="qty" name="qty"
                                    placeholder="Enter quantity" min="1" required>
                            </div>

                            <!-- Manufacturing Date -->
                            <div class="mb-3">
                                <label for="mfg_date" class="form-label">
                                    Manufacturing Date
                                </label>
                                <input type="date" class="form-control" id="mfg_date" name="mfg_date" required>
                            </div>

                            <!-- Brand -->
                            <div class="mb-3">
                                <label for="brand" class="form-label">Brand</label>
                                <input type="text" class="form-control" id="brand" name="brand"
                                    placeholder="Enter brand name" required>
                            </div>

                            <!-- Category -->
                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">Select Category</option>

                                    {%for cat in categoris%}
                                    <option value="{{cat.id}}">{{cat.name}}</option>
                                    {%endfor%}
                                </select>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    Register Product
                                </button>

                                <button type="reset" class="btn btn-secondary">
                                    Reset
                                </button>

                                <a href="{%url 'display'%}" class="btn btn-danger">display</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
