<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3 class="text-center mb-0">Product List</h3>
            </div>

            <div class="card-body">

                <table class="table table-bordered table-striped table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>MFG Date</th>
                            <th>Brand</th>
                            <th>Category</th>
                            <th colspan="2">Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        {%for pro in products%}
                        <tr>
                            <td>{{forloop.counter}}</td>
                            <td>{{pro.name}}</td>
                            <td>{{pro.price}}</td>
                            <td>{{pro.qty}}</td>
                            <td>{{pro.mfg}}</td>
                            <td>{{pro.brand}}</td>
                            <td>{{pro.category.name}}</td>
                            <td><a href="{%url 'delete'%}?id={{pro.id}}" class="btn btn-danger">Delete</a></td>
                            <td><a href="{%url 'update'%}?id={{pro.id}}" class="btn btn-primary">Update</a></td>
                        </tr>
                        {%endfor%}


                    </tbody>

                </table>

            </div>
        </div>

    </div>

</body>

</html>
