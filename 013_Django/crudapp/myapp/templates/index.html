<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">
                        {%if product%}
                        <h4 class="mb-0">Product Update</h4>
                        {%else%}
                        <h4 class="mb-0">Product Registration</h4>
                        {%endif%}
                    </div>

                    <div class="card-body">

                        <span class="text-success"> {{msg}}</span>


                        <form action="{%url 'register'%}" method="post">

                            {%csrf_token%}
                            <input type="hidden" name="id" value="{{product.id}}">
                            <!-- Product Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Product Name
                                </label>

                                <input type="text" class="form-control" id="name" name="name"
                                    placeholder="Enter product name" value="{{product.name}}" required>
                            </div>

                            <!-- Price -->
                            <div class="mb-3">
                                <label for="price" class="form-label">
                                    Price
                                </label>

                                <input type="number" class="form-control" id="price" name="price"
                                    placeholder="Enter product price" min="0" step="0.01" value="{{product.price}}"
                                    required>
                            </div>

                            <!-- Quantity -->
                            <div class="mb-3">
                                <label for="qty" class="form-label">
                                    Quantity
                                </label>

                                <input type="number" class="form-control" id="qty" name="qty" value="{{product.qty}}"
                                    placeholder="Enter quantity" min="1" required>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2">

                                <button type="submit" class="btn btn-primary">
                                    {%if product%}
                                    Update Product
                                    {%else%}
                                    Register Product
                                    {%endif%}
                                </button>

                                <button type="reset" class="btn btn-secondary">
                                    Reset
                                </button>

                                <a href="{%url 'display'%}" class="btn btn-danger">Display</a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
