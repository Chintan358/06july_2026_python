<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
</head>

<body>

    <h1>Employee information</h1>
    <table border="1">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Salary</th>
            <th colspan="2">Action</th>
        </tr>
        {%for emp in emps%}
        <tr>

            <td>{{emp.id}}</td>
            <td>{{emp.name}}</td>
            <td>{{emp.email}}</td>
            <td>{{emp.salary}}</td>
            <td><a href="{%url 'delete'%}?id={{emp.id}}">Delete</a></td>
            <td><a href="{%url 'update'%}?id={{emp.id}}">Update</a></td>
        </tr>
        {%endfor%}
    </table>
</body>

</html>
