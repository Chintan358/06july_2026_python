<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>


    <script>

        $(document).ready(function () {
            countries()
        })


        function test() {
            var q = $("#q").val()

            $.get('test', { q }, function (rt) {
                $("#result").html(rt)
            })

        }


        function search(q) {
            $.get('search', { q }, function (rt) {
                $("#resp").html(rt)
            })
        }


        function countries() {

            $.get("countries", {}, function (rt) {
                var options = "<option>---select country---</option>"
                rt.data.map(ele => {
                    options += `<option value=${ele.id}>${ele.name}</option>`
                })

                $("#country").html(options)
            })   


        }


        function states(cid) {


            $.get("states", { cid }, function (rt) {
                var options = "<option>---select state---</option>"
                rt.data.map(ele => {
                    options += `<option value=${ele.id}>${ele.name}</option>`
                })

                $("#state").html(options)
            })


        }



        function cities(sid) {


            $.get("cities", { sid }, function (rt) 
            {
                var options = "<option>---select City---</option>"
                rt.data.map(ele => {
                    options += `<option value=${ele.id}>${ele.name}</option>`
                })

                $("#city").html(options)
            })


        }


    </script>




</head>

<body>

    <input type="text" id="q">
    <button onclick="test()">Click me</button>
    <span id="result"></span>

    <br>
    <hr>
    <br>


    <input type="text" onkeyup="search(value)">
    <div id="resp"></div>


    <br>
    <hr>
    <br>


    <select name="country" id="country" onchange="states(value)">
        <option value="0">---select country---</option>
    </select>

    <select name="state" id="state" onchange="cities(value)">
        <option value="0">---select state---</option>
    </select>

    <select name="city" id="city">
        <option value="0">---select city---</option>
    </select>


</body>

</html>
